<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MVP: Читання за Федієнком</title>
    <!-- Підключаємо Tailwind для красивого дизайну без зайвого CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-4 md:p-8 font-sans text-gray-800">
    <div class="max-w-lg mx-auto bg-white p-6 md:p-8 rounded-xl shadow-lg border border-gray-100">
        <h1 class="text-2xl font-extrabold mb-6 text-center text-indigo-600">Асистент з читання (MVP)</h1>
        
        <!-- Крок 1: Цільовий звук -->
        <div class="mb-5">
            <label class="block mb-2 font-bold text-gray-700">Який звук вивчаємо?</label>
            <input type="text" id="targetSound" value="а" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none transition">
        </div>

        <!-- Крок 2: Завантаження еталону -->
        <div class="mb-5">
            <label class="block mb-2 font-bold text-gray-700">1. Завантажте еталон (файл мами):</label>
            <input type="file" id="etalonFile" accept=".wav" class="w-full p-2 border border-gray-300 rounded-lg file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100 cursor-pointer">
        </div>

        <!-- Крок 3: Запис дитини -->
        <div class="mb-8 p-5 bg-blue-50 rounded-lg border border-blue-100">
            <label class="block mb-3 font-bold text-blue-900">2. Запис голосу дитини:</label>
            <div class="flex items-center gap-4">
                <button id="recordBtn" class="bg-blue-600 text-white px-5 py-3 rounded-full font-bold shadow-md hover:bg-blue-700 transition flex items-center gap-2">
                    <span id="recordIcon">🎤</span> <span id="recordText">Почати запис</span>
                </button>
                <span id="recordStatus" class="text-sm font-medium text-blue-800">Готовий до запису</span>
            </div>
        </div>

        <!-- Кнопка відправки -->
        <button id="submitBtn" class="w-full bg-green-500 text-white px-4 py-4 rounded-xl font-extrabold text-lg shadow-lg hover:bg-green-600 hover:shadow-xl transition transform hover:-translate-y-1">
            Перевірити вимову ✨
        </button>

        <!-- Блок результату -->
        <div id="resultBox" class="mt-6 p-5 rounded-xl hidden text-center transition-all duration-300">
            <p id="resultMessage" class="font-black text-xl mb-2"></p>
            <p id="resultScore" class="font-medium text-sm opacity-90"></p>
        </div>
    </div>

    <script>
        let mediaRecorder;
        let audioChunks = [];
        let childWavBlob = null;

        const recordBtn = document.getElementById('recordBtn');
        const recordText = document.getElementById('recordText');
        const recordIcon = document.getElementById('recordIcon');
        const recordStatus = document.getElementById('recordStatus');
        const submitBtn = document.getElementById('submitBtn');

        // Логіка запису з мікрофона
        recordBtn.addEventListener('click', async () => {
            if (!mediaRecorder || mediaRecorder.state === 'inactive') {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    mediaRecorder.start();
                    audioChunks = [];
                    
                    recordText.textContent = 'Зупинити';
                    recordIcon.textContent = '⏹';
                    recordBtn.classList.replace('bg-blue-600', 'bg-red-500');
                    recordBtn.classList.replace('hover:bg-blue-700', 'hover:bg-red-600');
                    recordStatus.textContent = 'Йде запис... 🔴';

                    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                    
                    mediaRecorder.onstop = async () => {
                        recordText.textContent = 'Перезаписати';
                        recordIcon.textContent = '🎤';
                        recordBtn.classList.replace('bg-red-500', 'bg-blue-600');
                        recordBtn.classList.replace('hover:bg-red-600', 'hover:bg-blue-700');
                        recordStatus.textContent = 'Запис збережено! ✅';
                        
                        // Конвертація WebM -> WAV
                        const webmBlob = new Blob(audioChunks);
                        childWavBlob = await convertToWav(webmBlob);
                    };
                } catch (err) {
                    alert('Помилка доступу до мікрофона. Дозвольте використання мікрофона в браузері.');
                }
            } else {
                mediaRecorder.stop();
            }
        });

        // Функція перетворення сирого аудіо браузера у WAV (16-bit PCM)
        async function convertToWav(blob) {
            const arrayBuffer = await blob.arrayBuffer();
            const audioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
            const audioBuffer = await audioContext.decodeAudioData(arrayBuffer);
            
            const numOfChan = audioBuffer.numberOfChannels;
            const length = audioBuffer.length * numOfChan * 2 + 44;
            const buffer = new ArrayBuffer(length);
            const view = new DataView(buffer);
            const channels = [];
            const sampleRate = audioBuffer.sampleRate;
            let offset = 0;
            let pos = 0;

            function setUint16(data) { view.setUint16(offset, data, true); offset += 2; }
            function setUint32(data) { view.setUint32(offset, data, true); offset += 4; }

            // WAV Header
            setUint32(0x46464952); // "RIFF"
            setUint32(length - 8);
            setUint32(0x45564157); // "WAVE"
            setUint32(0x20746d66); // "fmt " chunk
            setUint32(16);
            setUint16(1); // PCM
            setUint16(numOfChan);
            setUint32(sampleRate);
            setUint32(sampleRate * 2 * numOfChan);
            setUint16(numOfChan * 2);
            setUint16(16);
            setUint32(0x61746164); // "data" chunk
            setUint32(length - pos - 4);

            for (let i = 0; i < audioBuffer.numberOfChannels; i++) {
                channels.push(audioBuffer.getChannelData(i));
            }

            while (pos < audioBuffer.length) {
                for (let i = 0; i < numOfChan; i++) {
                    let sample = Math.max(-1, Math.min(1, channels[i][pos]));
                    sample = (0.5 + sample < 0 ? sample * 32768 : sample * 32767) | 0;
                    view.setInt16(offset, sample, true);
                    offset += 2;
                }
                pos++;
            }

            return new Blob([buffer], { type: "audio/wav" });
        }

        // Відправка даних на сервер
        submitBtn.addEventListener('click', async () => {
            const targetSound = document.getElementById('targetSound').value;
            const etalonFile = document.getElementById('etalonFile').files[0];

            if (!etalonFile) { alert('Будь ласка, завантажте еталонний файл!'); return; }
            if (!childWavBlob) { alert('Будь ласка, запишіть голос!'); return; }

            submitBtn.textContent = 'Аналізую... ⏳';
            submitBtn.disabled = true;
            submitBtn.classList.add('opacity-75');

            const formData = new FormData();
            formData.append('target_sound', targetSound);
            formData.append('etalon_file', etalonFile);
            formData.append('child_file', childWavBlob, 'child_record.wav');

            try {
                const response = await fetch('http://127.0.0.1:8000/api/compare', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                const resultBox = document.getElementById('resultBox');
                const resultMessage = document.getElementById('resultMessage');
                const resultScore = document.getElementById('resultScore');
                
                // Очищаємо попередні класи
                resultBox.className = 'mt-6 p-5 rounded-xl text-center transition-all duration-300';
                resultBox.classList.remove('hidden');
                
                if (data.verdict === 'success') {
                    resultBox.classList.add('bg-green-100', 'text-green-800', 'border', 'border-green-200');
                    resultMessage.textContent = '✅ ' + data.message;
                } else {
                    resultBox.classList.add('bg-red-100', 'text-red-800', 'border', 'border-red-200');
                    resultMessage.textContent = '🔄 ' + data.message;
                }
                
                resultScore.textContent = `Схожість: ${data.score}% (Поріг для звуку [${data.target_sound}]: ${data.threshold_applied}%)`;
            } catch (err) {
                alert('Помилка з\'єднання із сервером. Перевірте, чи запущено FastAPI (main.py).');
            } finally {
                submitBtn.textContent = 'Перевірити вимову ✨';
                submitBtn.disabled = false;
                submitBtn.classList.remove('opacity-75');
            }
        });
    </script>
</body>
</html>
